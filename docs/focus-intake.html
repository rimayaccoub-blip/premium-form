<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --navy-1:#0b1a2e;
    --navy-2:#14294a;
    --gold-1:#e8c07d;
    --gold-2:#d19a4e;
    --copper:#c08457;
    --mark:#4a83ad;
  }

  body{
    font-family:'Heebo','Segoe UI',Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy-1),var(--navy-2),#0d1f38);
    background-attachment:fixed;
    min-height:100vh;
    padding:22px 16px 70px;
    color:#fff;
    direction:rtl;
    text-align:right;
  }

  .container{max-width:700px;margin:0 auto}

  /* ===== مبدّل اللغة ===== */
  .lang-bar{display:flex;justify-content:center;margin-bottom:22px}
  .lang-switch{
    display:flex;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);border-radius:50px;padding:4px;gap:2px;
  }
  .lang-btn{
    background:none;border:none;color:rgba(255,255,255,.6);
    font-family:inherit;font-size:13.5px;font-weight:700;
    padding:7px 20px;border-radius:50px;cursor:pointer;transition:all .2s;
  }
  .lang-btn.active{background:linear-gradient(90deg,var(--gold-1),var(--gold-2));color:var(--navy-1)}
  .lang-btn:not(.active):hover{color:#fff}

  /* ===== اللوغو ===== */
  .brand{text-align:center;margin-bottom:26px}
  .brand svg{display:block;margin:0 auto 12px}
  .brand .wordmark{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(23px,4.6vw,31px);
    letter-spacing:.16em;color:var(--copper);
    font-weight:500;line-height:1.1;
  }
  .brand .tagline{
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:clamp(9.5px,1.9vw,11.5px);
    letter-spacing:.34em;color:var(--copper);
    opacity:.85;margin-top:7px;
  }
  .brand .entity{
    font-size:10.5px;letter-spacing:.16em;
    color:rgba(255,255,255,.42);margin-top:14px;line-height:1.9;
    direction:ltr;
  }

  /* ===== الهيدر ===== */
  .header{text-align:center;margin-bottom:28px}
  .badge{
    display:inline-block;
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));
    color:var(--navy-1);font-weight:800;font-size:12px;
    letter-spacing:2px;padding:5px 20px;border-radius:50px;margin-bottom:16px;
  }
  .header h1{font-size:clamp(23px,4.8vw,34px);font-weight:900;line-height:1.35;margin-bottom:14px}
  .header h1 span{color:var(--gold-1)}
  .header p{font-size:15px;opacity:.82;max-width:560px;margin:0 auto;line-height:1.85}

  .meta-row{
    display:flex;justify-content:center;gap:22px;flex-wrap:wrap;
    margin-top:18px;font-size:12.5px;opacity:.6;
  }
  .meta-row span::before{content:'· ';color:var(--gold-1)}

  /* ===== شريط التقدم ===== */
  .progress-wrap{background:rgba(255,255,255,.1);border-radius:20px;height:6px;margin-bottom:10px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--gold-1),var(--gold-2));border-radius:20px;transition:width .4s ease;width:0}
  .progress-label{font-size:12px;opacity:.6;text-align:center;margin-bottom:26px}

  /* ===== الكرت ===== */
  .card{
    background:rgba(22,41,68,.55);
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;padding:30px 28px;margin-bottom:20px;
    display:none;animation:fadeIn .35s ease;
  }
  .card.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

  .section-tag{
    display:inline-block;font-size:11px;font-weight:700;color:var(--gold-1);
    background:rgba(232,192,125,.12);border:1px solid rgba(232,192,125,.25);
    padding:4px 12px;border-radius:50px;margin-bottom:14px;
  }
  .question{font-size:18.5px;font-weight:700;line-height:1.55;margin-bottom:6px}
  .sub{font-size:13px;opacity:.62;margin-bottom:20px;line-height:1.7}
  .sub:empty{display:none;margin:0}

  /* ===== الخيارات ===== */
  .options{display:flex;flex-direction:column;gap:10px}
  .option{
    background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.15);
    border-radius:12px;padding:15px 18px;cursor:pointer;
    font-size:15px;line-height:1.55;
    transition:background .15s,border-color .15s;
    touch-action:manipulation;-webkit-tap-highlight-color:rgba(232,192,125,.3);
    -webkit-user-select:none;user-select:none;position:relative;z-index:1;
  }
  @media(hover:hover){.option:hover{background:rgba(232,192,125,.14);border-color:var(--gold-1)}}
  .option:active{background:rgba(232,192,125,.22);border-color:var(--gold-1)}
  .option.selected{
    background:linear-gradient(90deg,rgba(232,192,125,.25),rgba(209,154,78,.18));
    border-color:var(--gold-1);font-weight:600;
  }
  .option.multi.selected::after{
    content:'✓';position:absolute;color:var(--gold-1);font-weight:900;
    top:50%;transform:translateY(-50%);
  }
  [dir=rtl] .option.multi.selected::after{left:16px}
  .limit-note{font-size:12px;opacity:.5;margin-top:10px}
  .limit-note.hit{color:var(--gold-1);opacity:.9}

  /* ===== الحقول ===== */
  textarea,input[type=text],input[type=tel],input[type=email],input[type=number]{
    width:100%;background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.2);border-radius:12px;
    padding:14px 16px;color:#fff;font-size:15px;font-family:inherit;
    resize:vertical;outline:none;transition:border-color .2s;
    margin-bottom:4px;
  }
  input[type=number]{direction:ltr;text-align:left;font-size:19px;font-weight:700}
  textarea{min-height:120px;line-height:1.8}
  textarea:focus,input:focus{border-color:var(--gold-1)}
  textarea::placeholder,input::placeholder{color:rgba(255,255,255,.32);font-weight:400;font-size:14.5px}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}

  .num-wrap{position:relative}
  .num-wrap .unit{
    position:absolute;top:15px;font-size:16px;font-weight:700;
    opacity:.45;pointer-events:none;
  }
  [dir=rtl] .num-wrap .unit{left:16px}
  [dir=rtl] .num-wrap input{padding-left:52px}
  [dir=ltr] .num-wrap .unit{right:16px}
  [dir=ltr] .num-wrap input{padding-right:52px}

  .phone-row{display:flex;gap:8px}
  .phone-row select{
    flex:0 0 38%;background:rgba(255,255,255,.08);
    border:1.5px solid rgba(255,255,255,.2);border-radius:12px;
    padding:14px 12px;color:#fff;font-size:14px;font-family:inherit;
    outline:none;cursor:pointer;
  }
  .phone-row select:focus{border-color:var(--gold-1)}
  .phone-row select option{background:var(--navy-2);color:#fff}
  .phone-row input{flex:1;direction:ltr;text-align:left;margin-bottom:0}
  .phone-preview{font-size:12px;opacity:.5;margin-top:8px;direction:ltr}

  .field-label{font-size:13px;opacity:.78;margin:14px 0 8px;font-weight:600}
  .field-label:first-child{margin-top:0}

  /* ===== المقياس ===== */
  .range-wrap{padding:8px 0}
  input[type=range]{
    width:100%;-webkit-appearance:none;height:6px;border-radius:3px;
    background:rgba(255,255,255,.2);outline:none;direction:ltr;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-1),var(--gold-2));cursor:pointer;
    box-shadow:0 0 8px rgba(232,192,125,.5);
  }
  input[type=range]::-moz-range-thumb{
    width:22px;height:22px;border:none;border-radius:50%;
    background:linear-gradient(135deg,var(--gold-1),var(--gold-2));cursor:pointer;
  }
  .range-value{text-align:center;font-size:36px;font-weight:800;color:var(--gold-1);margin:12px 0 4px}
  .range-labels{display:flex;justify-content:space-between;font-size:12px;opacity:.55;margin-top:8px;gap:12px}

  /* ===== الأزرار ===== */
  .nav-row{display:flex;gap:10px;align-items:center;margin-top:26px}
  .btn-next{
    flex:1;background:linear-gradient(90deg,var(--gold-1),var(--gold-2));color:var(--navy-1);
    font-weight:800;font-size:16px;border:none;border-radius:50px;padding:15px 30px;
    cursor:pointer;font-family:inherit;transition:opacity .2s,transform .15s;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  }
  @media(hover:hover){.btn-next:hover{opacity:.9;transform:scale(1.01)}}
  .btn-next:active{opacity:.85}

  .btn-back{
    background:none;border:1.5px solid rgba(255,255,255,.22);color:#fff;
    border-radius:50px;padding:14px 22px;font-size:14px;font-family:inherit;
    cursor:pointer;opacity:.75;transition:opacity .2s,border-color .2s;
  }
  .btn-back:hover{opacity:1;border-color:var(--gold-1)}

  .consent{font-size:12px;opacity:.5;line-height:1.75;margin-top:18px;
           padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}

  /* ===== شاشة الإنهاء ===== */
  .final-card{text-align:center}
  .final-card .icon{
    width:66px;height:66px;border-radius:50%;margin:0 auto 22px;
    background:linear-gradient(135deg,var(--gold-1),var(--gold-2));color:var(--navy-1);
    font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;
  }
  .final-card h2{font-size:clamp(22px,4.6vw,29px);font-weight:900;line-height:1.45;margin-bottom:16px}
  .final-card h2 span{color:var(--gold-1)}
  .final-card p{font-size:15px;line-height:2;opacity:.85;margin-bottom:14px}

  .steps-box{
    background:rgba(232,192,125,.09);border:1px solid rgba(232,192,125,.28);
    border-radius:16px;padding:22px;margin:26px 0 6px;
  }
  .steps-box h3{font-size:15px;font-weight:800;color:var(--gold-1);margin-bottom:14px}
  .steps-box ol{padding-inline-start:20px}
  .steps-box li{font-size:14px;line-height:2;opacity:.9;margin-bottom:6px}

  .signature{font-size:13px;opacity:.55;margin-top:26px;line-height:1.9}

  .soft-stop h2{font-size:24px;font-weight:900;margin-bottom:16px;line-height:1.5}
  .soft-stop p{font-size:15px;line-height:2.05;opacity:.85;margin-bottom:14px}

  .err{color:#ff9b9b;font-size:13px;margin-top:10px;display:none}
  .err.show{display:block}
</style>
</head>

<div class="container">

  <!-- ===== مبدّل اللغة ===== -->
  <div class="lang-bar" id="langBar">
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="ar">العربية</button>
      <button class="lang-btn" data-lang="he">עברית</button>
    </div>
  </div>

     he:'אם נוכל לפתור בעיה אחת בלבד בפגישת FOCUS, כזו שתעשה את ההבדל הגדול ביותר בחודשים הקרובים — מה היא תהיה?'},
  sub:{ar:'مشكلة وحدة. مش لستة.',he:'בעיה אחת. לא רשימה.'} },

{ id:'notes', type:'text', min:0, optional:true,
  sec:{ar:'٦ · وين نركّز',he:'6 · איפה מתמקדים'},
  q:{ar:'في إشي تاني مهم أعرفه قبل الجلسة؟',he:'יש עוד משהו שחשוב שאדע לפני הפגישה?'},
  sub:{ar:'اختياري.',he:'אופציונלי.'} }
];

// ============================================================
//  المحرك
// ============================================================
let LANG = 'ar';
let t    = UI.ar;

const answers = {};
let flowIndex = 0;
let showAds   = false;

const stage   = document.getElementById('stage');
const progBar = document.getElementById('progressBar');
const progLbl = document.getElementById('progressLabel');

function L(o){ return o ? (o[LANG] || o.ar || '') : ''; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function onTap(el, fn){
  let sx=0, sy=0, moved=false;
  el.addEventListener('touchstart', e=>{moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  el.addEventListener('touchmove',  e=>{
    if(Math.abs(e.touches[0].clientX-sx)>10||Math.abs(e.touches[0].clientY-sy)>10) moved=true;
  },{passive:true});
  el.addEventListener('touchend', e=>{ if(moved) return; e.preventDefault(); fn(e); },{passive:false});
  el.addEventListener('click', fn);
}

// ---------- تبديل اللغة ----------
document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => {
    if(b.dataset.lang === LANG) return;
    LANG = b.dataset.lang;
    t    = UI[LANG];
    document.querySelectorAll('.lang-btn').forEach(x => x.classList.toggle('active', x === b));
    document.documentElement.lang = t.lang;
    document.documentElement.dir  = t.dir;
    paintChrome();
    if(document.getElementById('finalCard').classList.contains('active')) paintFinal();
    else if(document.getElementById('softStop').classList.contains('active')) paintStop();
    else render();
  });
});

function paintChrome(){
  document.getElementById('hTitle').innerHTML = t.title;
  document.getElementById('hDesc').textContent = t.desc;
  document.getElementById('hMeta').innerHTML = t.meta.map(m => '<span>'+esc(m)+'</span>').join('');
  if(!progLbl.dataset.started) progLbl.textContent = t.start;
}

function paintStop(){
  document.getElementById('ssTag').textContent   = t.ssTag;
  document.getElementById('ssTitle').textContent = t.ssTitle;
  document.getElementById('ssBody').innerHTML    = t.ssBody.map(p => '<p>'+esc(p)+'</p>').join('');
  document.getElementById('ssSign').innerHTML    = t.sign;
}

function paintFinal(){
  document.getElementById('fcTitle').innerHTML      = t.fcTitle;
  document.getElementById('fcBody').textContent     = t.fcBody;
  document.getElementById('fcStepsTitle').textContent = t.fcStepsTitle;
  document.getElementById('fcSteps').innerHTML      = t.fcSteps.map(s => '<li>'+esc(s)+'</li>').join('');
  document.getElementById('fcSign').innerHTML       = t.sign;
  progLbl.textContent = t.done;
}

function visibleQuestions(){
  return QUESTIONS.filter(q => !q.showIf || (q.showIf === 'ads' && showAds));
}

// ---------- الرسم ----------
function render(){
  const list = visibleQuestions();
  const q    = list[flowIndex];
  if(!q){ submitAll(); return; }

  const total = list.length;
  progLbl.dataset.started = '1';
  progLbl.textContent = t.of(flowIndex+1, total);
  progBar.style.width = Math.round((flowIndex/total)*100) + '%';

  let h = '';
  h += '<div class="section-tag">' + esc(L(q.sec)) + '</div>';
  h += '<div class="question">' + esc(L(q.q)) + '</div>';
  h += '<div class="sub">' + esc(L(q.sub)) + '</div>';

  if(q.type === 'contact'){
    h += '<div class="field-label">'+esc(t.fName)+'</div>' +
         '<input type="text" id="f_name" placeholder="'+esc(t.fNamePh)+'" />' +
         '<div class="field-label">'+esc(t.fPhone)+'</div>' +
         '<div class="phone-row">' +
           '<select id="f_cc">' +
             '<option value="972">🇮🇱 +972</option>' +
             '<option value="970">🇵🇸 +970</option>' +
             '<option value="962">🇯🇴 +962</option>' +
             '<option value="971">🇦🇪 +971</option>' +
             '<option value="966">🇸🇦 +966</option>' +
             '<option value="49">🇩🇪 +49</option>' +
             '<option value="1">🇺🇸 +1</option>' +
           '</select>' +
           '<input type="tel" id="f_phone" placeholder="050 000 0000" />' +
         '</div>' +
         '<div class="phone-preview" id="phonePrev"></div>' +
         '<div class="field-label">'+esc(t.fMail)+'</div>' +
         '<input type="email" id="f_email" placeholder="name@example.com" />' +
         '<div class="field-label">'+esc(t.fBiz)+'</div>' +
         '<input type="text" id="f_biz" placeholder="'+esc(t.fBizPh)+'" />' +
         '<div class="field-label">'+esc(t.fLink)+'</div>' +
         '<input type="text" id="f_link" placeholder="'+esc(t.fLinkPh)+'" />';
  }

  else if(q.type === 'choice' || q.type === 'multi'){
    const cls = q.type === 'multi' ? 'option multi' : 'option';
    h += '<div class="options" id="optGroup">';
    q.opts.forEach((o,i)=>{ h += '<div class="'+cls+'" data-i="'+i+'">'+esc(L(o))+'</div>'; });
    h += '</div>';
    if(q.type === 'multi') h += '<div class="limit-note" id="limitNote">'+esc(t.counter(0,q.max))+'</div>';
  }

  else if(q.type === 'number'){
    h += '<div class="num-wrap"><span class="unit">'+esc(q.unit||'')+'</span>' +
         '<input type="number" id="f_num" inputmode="numeric" placeholder="0" /></div>';
  }

  else if(q.type === 'text'){
    h += '<textarea id="f_text"></textarea>';
  }

  else if(q.type === 'scale'){
    h += '<div class="range-wrap">' +
           '<div class="range-value" id="scaleVal">5</div>' +
           '<input type="range" id="f_scale" min="1" max="10" value="5" step="1" />' +
           '<div class="range-labels"><span>'+esc(L(q.lo))+'</span><span>'+esc(L(q.hi))+'</span></div>' +
         '</div>';
  }

  h += '<div class="err" id="errBox"></div>';
  h += '<div class="nav-row">' +
         (flowIndex > 0 ? '<button class="btn-back" id="backBtn">'+esc(t.back)+'</button>' : '') +
         '<button class="btn-next" id="nextBtn">' +
           esc(flowIndex === total-1 ? t.submit : t.next) +
         '</button>' +
       '</div>';

  if(flowIndex === 0) h += '<p class="consent">'+esc(t.consent)+'</p>';

  stage.innerHTML = '<div class="card active">' + h + '</div>';
  restore(q);
  wire(q);
  window.scrollTo({top:0, behavior:'smooth'});
}

// ---------- استرجاع الإجابة عند الرجوع أو تبديل اللغة ----------
function restore(q){
  if(q.type === 'contact'){
    if(answers.name)     document.getElementById('f_name').value  = answers.name;
    if(answers._phoneLocal) document.getElementById('f_phone').value = answers._phoneLocal;
    if(answers._cc)      document.getElementById('f_cc').value    = answers._cc;
    if(answers.email)    document.getElementById('f_email').value = answers.email;
    if(answers.business) document.getElementById('f_biz').value   = answers.business;
    if(answers.link)     document.getElementById('f_link').value  = answers.link;
  }
  else if(q.type === 'choice'){
    const v = answers[q.id];
    if(!v) return;
    const i = q.opts.findIndex(o => o.v === v);
    if(i >= 0) document.querySelector('#optGroup .option[data-i="'+i+'"]').classList.add('selected');
  }
  else if(q.type === 'multi'){
    const v = answers[q.id];
    if(!v) return;
    const codes = v.split(',');
    let c = 0;
    q.opts.forEach((o,i)=>{
      if(codes.indexOf(o.v) > -1){
        document.querySelector('#optGroup .option[data-i="'+i+'"]').classList.add('selected');
        c++;
      }
    });
    document.getElementById('limitNote').textContent = t.counter(c, q.max);
  }
  else if(q.type === 'number' && answers[q.id]) document.getElementById('f_num').value = answers[q.id];
  else if(q.type === 'text'   && answers[q.id]) document.getElementById('f_text').value = answers[q.id];
  else if(q.type === 'scale'){
    const v = answers[q.id] || 5;
    document.getElementById('f_scale').value = v;
    document.getElementById('scaleVal').textContent = v;
  }
}

function wire(q){
  const nextBtn = document.getElementById('nextBtn');
  const backBtn = document.getElementById('backBtn');
  const errBox  = document.getElementById('errBox');

  if(backBtn) backBtn.onclick = () => { flowIndex--; render(); };

  const fail  = m => { errBox.textContent = m; errBox.classList.add('show'); };
  const clear = () => errBox.classList.remove('show');

  if(q.type === 'choice' || q.type === 'multi'){
    const group = document.getElementById('optGroup');
    const note  = document.getElementById('limitNote');
    group.querySelectorAll('.option').forEach(opt => {
      onTap(opt, () => {
        clear();
        if(q.type === 'choice'){
          group.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
          opt.classList.add('selected');
        } else {
          const n = group.querySelectorAll('.option.selected').length;
          if(!opt.classList.contains('selected') && n >= q.max){
            note.classList.add('hit');
            note.textContent = t.maxHit(q.max);
            return;
          }
          opt.classList.toggle('selected');
          note.classList.remove('hit');
          note.textContent = t.counter(group.querySelectorAll('.option.selected').length, q.max);
        }
      });
    });
  }

  if(q.type === 'scale'){
    const r = document.getElementById('f_scale');
    r.addEventListener('input', () => { document.getElementById('scaleVal').textContent = r.value; });
  }

  if(q.type === 'contact'){
    const cc = document.getElementById('f_cc');
    const ph = document.getElementById('f_phone');
    const pv = document.getElementById('phonePrev');
    const upd = () => {
      const local = ph.value.replace(/\D/g,'').replace(/^0+/,'');
      pv.textContent = local ? '+' + cc.value + ' ' + local : '';
    };
    cc.addEventListener('change', upd);
    ph.addEventListener('input', upd);
    upd();
  }

  nextBtn.onclick = () => {
    clear();

    if(q.type === 'contact'){
      const name  = document.getElementById('f_name').value.trim();
      const local = document.getElementById('f_phone').value.replace(/\D/g,'').replace(/^0+/,'');
      const email = document.getElementById('f_email').value.trim();
      const biz   = document.getElementById('f_biz').value.trim();
      if(name.length < 2)  return fail(t.errName);
      if(local.length < 7) return fail(t.errPhone);
      if(!/^\S+@\S+\.\S+$/.test(email)) return fail(t.errMail);
      if(biz.length < 2)   return fail(t.errBiz);
      answers._cc = document.getElementById('f_cc').value;
      answers._phoneLocal = document.getElementById('f_phone').value;
      answers.name     = name;
      answers.phone    = '+' + answers._cc + local;
      answers.email    = email;
      answers.business = biz;
      answers.link     = document.getElementById('f_link').value.trim();
    }

    else if(q.type === 'choice'){
      const sel = document.querySelector('#optGroup .option.selected');
      if(!sel) return fail(t.pickOne);
      const o = q.opts[Number(sel.dataset.i)];
      answers[q.id]        = o.v;
      answers[q.id + '_t'] = o.ar;
      if(q.id === 'ads') showAds = !!o.ads;
      answers['_flag_' + (o.flag || 'x')] = o.flag ? true : undefined;
      if(o.stop){ softStop(); return; }
    }

    else if(q.type === 'multi'){
      const sels = [...document.querySelectorAll('#optGroup .option.selected')];
      if(!sels.length) return fail(t.pickSome);
      const picked = sels.map(s => q.opts[Number(s.dataset.i)]);
      answers[q.id]        = picked.map(o => o.v).join(',');
      answers[q.id + '_t'] = picked.map(o => o.ar).join(' | ');
    }

    else if(q.type === 'number'){
      const v = document.getElementById('f_num').value;
      if(v === '' || Number(v) <= 0) return fail(t.needNum);
      answers[q.id] = Number(v);
    }

    else if(q.type === 'text'){
      const v = document.getElementById('f_text').value.trim();
      if(!q.optional && v.length < (q.min || 10)) return fail(t.needText);
      answers[q.id] = v;
    }

    else if(q.type === 'scale'){
      answers[q.id] = Number(document.getElementById('f_scale').value);
    }

    flowIndex++;
    render();
  };
}

function hideForm(){
  stage.innerHTML = '';
  document.getElementById('header').style.display = 'none';
  document.getElementById('progWrap').style.display = 'none';
}

function softStop(){
  answers._stopped = true;
  send();
  hideForm();
  progLbl.style.display = 'none';
  paintStop();
  document.getElementById('softStop').classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function submitAll(){
  send();
  hideForm();
  document.getElementById('progWrap').style.display = 'block';
  progBar.style.width = '100%';
  paintFinal();
  document.getElementById('finalCard').classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}

function send(){
  answers._form = FORM_NAME;
  answers._lang = LANG;
  answers._at   = new Date().toISOString();
  delete answers._phoneLocal;
  delete answers._cc;
  try{
    fetch(ENDPOINT + '?data=' + encodeURIComponent(JSON.stringify(answers)),
          { method:'GET', mode:'no-cors' });
  }catch(e){ console.error(e); }
}

paintChrome();
render();
</script>
</body>
</html>
