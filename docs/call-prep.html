<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحضير للمكالمة | ريما يعقوب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a2b;--bg2:#13233a;--card:#162a45;--ink:#f3efe6;--mute:#a9b3c2;--line:rgba(212,175,106,.22);--gold:#d4af6a;--gold2:#b88a3e}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1d3558 0%,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;font-size:18px;line-height:1.7;min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:40px 16px 70px}
.brand{text-align:center;letter-spacing:4px;color:var(--gold);font-size:13px;font-weight:500}
.rule{width:60px;height:1px;background:var(--gold);margin:14px auto}
h1{font-family:Amiri,serif;text-align:center;font-size:36px;line-height:1.3;margin:6px 0 10px}
.lead{text-align:center;color:var(--mute);margin:0 auto 30px;max-width:480px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:28px 24px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.prog{display:flex;justify-content:space-between;color:var(--gold);font-size:14px;letter-spacing:1px;margin-bottom:8px}
.bar{height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .4s}
.tag{color:var(--gold);font-size:14px;margin-bottom:4px}
h2{font-size:23px;margin:0 0 6px;font-weight:700}
.hint{color:var(--mute);font-size:15px;margin:0 0 18px}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--gold);background:rgba(212,175,106,.06)}
.opt.on{border-color:var(--gold);background:rgba(212,175,106,.16)}
input,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:12px}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:110px;resize:vertical}
::placeholder{color:#7d889a}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.btn{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0e1a2b;border:0;border-radius:14px;padding:13px 26px;font:inherit;font-weight:800;cursor:pointer}
.back{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer}
.err{color:#e8a0a0;font-size:15px;min-height:24px}
.list{list-style:none;padding:0;margin:0 0 8px}
.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.list li:last-child{border:0}
.num{color:var(--gold);font-family:Amiri,serif;font-size:22px;line-height:1.2;min-width:22px}
.foot{text-align:center;color:var(--mute);font-size:14px;margin-top:26px}
.center{text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">RIMA YAQUB · BUSINESS STRATEGY</div>
  <div class="rule"></div>
  <h1>التحضير لمكالمتنا</h1>
  <p class="lead">عشان نطلع من المكالمة بصورة واضحة وخطوة حقيقية، جهّز إجاباتك هون. بتاخذ أقل من 5 دقائق.</p>

  <div class="card">
    <div class="prog" id="progWrap"><span id="cnt"></span><span id="lbl"></span></div>
    <div class="bar" id="barWrap"><i id="bar"></i></div>
    <div id="body"></div>
    <div class="err" id="err"></div>
    <div class="nav" id="nav">
      <button class="back" id="back" onclick="go(-1)">رجوع</button>
      <button class="btn" id="next" onclick="go(1)">ابدأ</button>
    </div>
  </div>
  <div class="foot">كل المعلومات اللي بتشاركها بتضل سرية وبتنستعمل بس لتحضير المكالمة</div>
</div>

<script>
const PHONE="972525751404";
const ENDPOINT="https://script.google.com/macros/s/AKfycbyoXeeHakOSzE1HRqE0L3WhxzqXjPkU4fO9uMb4R2lqBJ_EMhr6w0wN82NRjOAQJJOw/exec"; // رابط Apps Script (call-prep-apps-script.gs)
const S=[
 {k:"intro"},
 {k:"c",t:"شو نوع البزنس تبعك؟",o:["عيادة / مركز تجميل أو علاجي","كوتش / مستشار / مدرب","مقدم خدمات مستقل","بزنس خدمات آخر"]},
 {k:"c",t:"شو أكثر إشي بدك تحققه حاليًا؟",o:["زيادة الزبائن والمبيعات","زيادة الربحية وتنظيم البزنس","بناء خدمات أو برامج جديدة","التوسع أو فتح مشروع جديد","مش عارف وين المشكلة وبدي تشخيص"]},
 {k:"c",t:"قديش متوسط إيراداتك الشهرية تقريبًا؟",h:"بالدولار، رقم تقريبي بكفي",o:["لسه ما بلشت أبيع","أقل من $3,000","$3,000-$8,000","$8,000-$16,000","أكثر من $16,000"]},
 {k:"c",t:"شو نوع المساعدة اللي بتدور عليها؟",o:["جلسة تشخيص وخطة أولية","مرافقة استراتيجية وتنفيذ","بدي أفهم الخيارات قبل ما أقرر"]},
 {k:"c",t:"إذا لقينا إنه في ملاءمة، متى حابب تبدأ؟",o:["خلال أسبوع","خلال شهر","خلال 3 أشهر","عم بستكشف حاليًا"]},
 {k:"t",t:"شو التحدي الأكبر اللي بتواجهه بالبزنس اليوم؟",h:"احكي بكلماتك، بدون تجميل"},
 {k:"t",t:"وين بدك يكون البزنس تبعك بعد 12 شهر؟",h:"دخل، شكل الشغل، وقتك"},
 {k:"t",t:"شو جربت لحد اليوم وما أعطى النتيجة اللي توقعتها؟",h:"إعلانات، سوشيال، كورسات، تغيير أسعار..."},
 {k:"t",t:"شو السؤال الواحد اللي لازم تطلع من المكالمة وإنت عارف جوابه؟"},
 {k:"d"},
 {k:"done"}
];
const A={};let i=0;
const QN=S.filter(s=>s.k==="c"||s.k==="t").length+1;
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function draw(){
 const s=S[i],b=document.getElementById("body"),n=document.getElementById("next");
 document.getElementById("err").textContent="";
 const showProg=s.k!=="intro"&&s.k!=="done";
 ["progWrap","barWrap"].forEach(id=>document.getElementById(id).style.display=showProg?"":"none");
 document.getElementById("nav").style.display=s.k==="done"?"none":"flex";
 document.getElementById("back").style.visibility=i>0?"visible":"hidden";
 document.getElementById("cnt").textContent=i+" / "+QN;
 document.getElementById("lbl").textContent=i<=5?"عن البزنس":i<=9?"أسئلة التحضير":"التواصل";
 document.getElementById("bar").style.width=(i/QN*100)+"%";

 if(s.k==="intro"){
  b.innerHTML=`<h2>شو رح يصير بالمكالمة؟</h2><p class="hint">مكالمة مركّزة، مش مكالمة تعارف عامة</p>
  <ul class="list">
   <li><span class="num">١</span><span>نفهم وين البزنس تبعك اليوم بالأرقام</span></li>
   <li><span class="num">٢</span><span>نحدد وين الفجوة بين الوضع الحالي والهدف</span></li>
   <li><span class="num">٣</span><span>نشوف إذا في ملاءمة، وشو الخطوة الصح إلك</span></li>
  </ul>`;n.textContent="ابدأ التحضير";
 }else if(s.k==="c"){
  b.innerHTML=`<h2>${s.t}</h2>${s.h?`<p class="hint">${s.h}</p>`:`<div style="height:12px"></div>`}`+
   s.o.map((o,j)=>`<button class="opt ${A[i]===o?"on":""}" onclick="pick('${j}')">${o}</button>`).join("");
  n.textContent="التالي";
 }else if(s.k==="t"){
  b.innerHTML=`<div class="tag">سؤال للتفكير</div><h2>${s.t}</h2>${s.h?`<p class="hint">${s.h}</p>`:`<div style="height:12px"></div>`}
   <textarea id="ta" placeholder="اكتب هون...">${esc(A[i])}</textarea>`;
  n.textContent="التالي";
 }else if(s.k==="d"){
  b.innerHTML=`<h2>آخر خطوة</h2><p class="hint">عشان نثبت موعد المكالمة ونبعتلك التفاصيل</p>
   <input id="nm" placeholder="الاسم الكامل" value="${esc(A.name)}">
   <input id="bz" placeholder="اسم البزنس" value="${esc(A.biz)}">
   <input id="ph" type="tel" placeholder="رقم الواتساب" value="${esc(A.phone)}">`;
  n.textContent="إرسال";
 }else{
  b.innerHTML=`<div class="center"><div class="rule"></div><h2>شكرًا ${esc(A.name)}</h2>
   <p class="hint">وصلتني إجاباتك. رح أراجعها قبل المكالمة وبتواصل معك على الواتساب لتثبيت الموعد.</p>
   <button class="btn" onclick="send()">راسلني على الواتساب</button></div>`;
 }
}
function pick(j){A[i]=S[i].o[+j];draw();setTimeout(()=>go(1),260)}
function go(d){
 const s=S[i];
 if(d<0){i=Math.max(0,i-1);return draw()}
 if(s.k==="c"&&!A[i]){document.getElementById("err").textContent="اختار إجابة وحدة للمتابعة";return}
 if(s.k==="t"){A[i]=document.getElementById("ta").value.trim();if(!A[i]){document.getElementById("err").textContent="جملة وحدة بتكفي";return}}
 if(s.k==="d"){
  A.name=document.getElementById("nm").value.trim();A.biz=document.getElementById("bz").value.trim();A.phone=document.getElementById("ph").value.trim();
  if(!A.name||A.phone.replace(/\D/g,"").length<9){document.getElementById("err").textContent="عبّي الاسم ورقم الواتساب";return}
  return submit();
 }
 i++;draw();
}
const PTS=[[20,18,15,10],[18,20,15,16,12],[0,5,18,26,30],[12,20,8],[10,8,4,0]];
function submit(){
 const n=document.getElementById("next");n.disabled=true;n.textContent="جاري الإرسال...";
 const idx=k=>S[k].o.indexOf(A[k]);
 let sc=0;for(let k=1;k<=5;k++)sc+=PTS[k-1][idx(k)];
 const tier=idx(3)===0?"غير ملائم":sc>=75?"ساخن":sc>=50?"دافئ":sc>=30?"متابعة":"غير ملائم";
 const d={name:A.name,business:A.biz,phone:A.phone,
  q1_type:A[1],q2_goal:A[2],q3_revenue_usd:A[3],q4_help:A[4],q5_timing:A[5],
  p1_challenge:A[6],p2_vision:A[7],p3_tried:A[8],p4_question:A[9],score:sc,tier:tier};
 try{localStorage.setItem("call_prep",JSON.stringify(d))}catch(e){}
 if(!ENDPOINT){i++;draw();return send()}
 fetch(ENDPOINT+"?data="+encodeURIComponent(JSON.stringify(d)),{mode:"no-cors"})
  .then(()=>{i++;draw()})
  .catch(()=>{n.disabled=false;n.textContent="إرسال";document.getElementById("err").innerHTML='صار خلل بالإرسال. جرب مرة ثانية أو <a href="#" onclick="send();return false" style="color:#d4af6a">ابعت الإجابات بالواتساب</a>'});
}
function send(){
 let m="مرحبا ريما، هاي إجابات التحضير للمكالمة:\n\nالاسم: "+A.name+"\nالبزنس: "+(A.biz||"-")+"\nالواتساب: "+A.phone+"\n";
 S.forEach((s,k)=>{if(s.k==="c"||s.k==="t")m+="\n"+k+". "+s.t+"\n"+A[k]+"\n"});
 window.open("https://wa.me/"+PHONE+"?text="+encodeURIComponent(m),"_blank")||(location.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(m));
}
draw();
</script>
</body>
</html>
