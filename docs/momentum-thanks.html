<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>تم التسجيل — Momentum Pro</title>

  <!--
    This page is only reached after a successful Rav Messer signup, so it is the
    most reliable place to report the conversion. The Rav Messer form fires its
    own CompleteRegistration on the submit event, but the browser navigates away
    in the same tick and the beacon is often lost.
  -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '914783969729003');
    fbq('track', 'PageView');
    fbq('track', 'CompleteRegistration');
  </script>
  <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=914783969729003&ev=CompleteRegistration&noscript=1" /></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* Palette lifted from the Momentum_Pro landing page so the handoff is seamless. */
    :root {
      --cream: #F5EFE6;
      --surface: #FFFFFF;
      --ink: #2C2218;
      --ink-strong: #1E1509;
      --accent: #B07D3A;
      --accent-tint: rgba(176, 125, 58, 0.10);
      --accent-line: rgba(176, 125, 58, 0.22);
      --wa: #25D366;
      --wa-ink: #06331A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', 'Segoe UI', Arial, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px 64px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .check {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #D4A96A, var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 10px 28px rgba(176, 125, 58, 0.28);
    }

    h1 {
      font-size: clamp(26px, 5.5vw, 36px);
      font-weight: 900;
      line-height: 1.3;
      color: var(--ink-strong);
      margin-bottom: 16px;
    }
    h1 span { color: var(--accent); }

    .lead {
      font-size: 16.5px;
      line-height: 1.85;
      color: rgba(44, 34, 24, 0.72);
      margin-bottom: 34px;
    }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      background: var(--wa);
      color: var(--wa-ink);
      font-size: 18px;
      font-weight: 800;
      font-family: inherit;
      text-decoration: none;
      padding: 18px 24px;
      border-radius: 14px;
      box-shadow: 0 10px 26px rgba(37, 211, 102, 0.3);
      transition: transform 0.15s ease;
    }
    .wa-btn:active { transform: scale(0.985); }
    .wa-btn svg { width: 24px; height: 24px; fill: var(--wa-ink); }

    .hint {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(44, 34, 24, 0.52);
    }

    .sig {
      margin-top: 40px;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: rgba(44, 34, 24, 0.45);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>

    <h1>وصلتني تفاصيلك <span>بنجاح</span></h1>

    <p class="lead">
      باقي خطوة وحدة بس.<br />
      اضغطي على الزر وابعتي الرسالة الجاهزة، وبوصلك تفاصيل محادثة الملاءمة.
    </p>

    <a id="waBtn" class="wa-btn" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.2-1.2-.5-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.2-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3z"/><path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3.1.8.8-3-.2-.3c-.8-1.3-1.3-2.9-1.3-4.5 0-4.6 3.8-8.4 8.4-8.4s8.4 3.8 8.4 8.4-3.8 8.4-8.4 8.4z"/></svg>
      تواصلي معي بالواتساب الآن
    </a>

    <p class="hint">
      بيفتح معك واتساب مع رسالة جاهزة. كل اللي عليكِ تضغطي إرسال.
    </p>

    <p class="sig">ريما يعقوب · مدرّبة ومستشارة أعمال</p>
  </div>

  <script>
    (function () {
      var PHONE = '972559311440';
      var KEYWORD = 'Momentum';

      // Rav Messer can pass the subscriber's details in the query string.
      // We accept the common spellings so the message arrives with her name.
      var params = new URLSearchParams(window.location.search);
      var name = '';
      ['name', 'fullname', 'full_name', 'fname', 'firstname', 'שם', 'الاسم'].forEach(function (key) {
        if (!name && params.get(key)) { name = params.get(key).trim(); }
      });

      var text = KEYWORD;
      if (name) { text += ' - ' + name; }

      document.getElementById('waBtn')
        .setAttribute('href', 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(text));
    })();
  </script>
</body>
</html>
